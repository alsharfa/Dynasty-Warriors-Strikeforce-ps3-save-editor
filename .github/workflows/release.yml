name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Run save regression checks
        run: python -m unittest discover -s tests -v
      - name: Check source GUI and bundled database
        run: python scripts/smoke_test.py
      - name: Build portable Windows EXE
        run: python scripts/build_windows.py
      - name: Check actual EXE outside the source folder
        run: python scripts/smoke_test.py --exe "dist/Dynasty Warriors Strikeforce PS3 Save Editor.exe"
      - name: Package verified release files
        run: python scripts/package_release.py --exe "dist/Dynasty Warriors Strikeforce PS3 Save Editor.exe" --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-dist
      - name: Verify downloaded release files
        working-directory: release-dist
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish a new version from the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          EXISTING=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$EXISTING" = false ]; then
            echo "$TAG is already published; it will not be modified. Bump VERSION for a new release."
            exit 0
          fi
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Existing tag points to another commit; refusing to move it."
            exit 1
          fi
          if [ "$EXISTING" = true ]; then
            DRAFT_TARGET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$DRAFT_TARGET" = "$GITHUB_SHA"
            gh release upload "$TAG" release-dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft \
              --title "Dynasty Warriors: Strikeforce PS3 Save Editor $TAG" \
              --notes-file CHANGELOG.md
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
