name: Publish v4.0.0 Release

on:
  push:
    branches:
      - release-v4.0.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE="release/Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip"
          python3 - <<'PY'
          import base64
          from pathlib import Path

          base = Path('release/Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip')
          encoded = b''.join(Path(str(base) + f'.part3.b64.{n:02d}').read_bytes() for n in range(1, 5))
          part3 = base64.b64decode(encoded, validate=False)
          output = Path('Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip')
          output.write_bytes(
              Path(str(base) + '.part1').read_bytes()
              + Path(str(base) + '.part2').read_bytes()
              + part3
          )
          print(f'Rebuilt {output} ({output.stat().st_size} bytes)')
          PY
          unzip -t Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip
          sha256sum Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v4.0.0 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v4.0.0 \
            Dynasty_Warriors_Strikeforce_PS3_Save_Editor_Source.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Dynasty Warriors: Strikeforce PS3 Save Editor v4.0.0" \
            --notes "First public release of Dynasty Warriors: Strikeforce PS3 Save Editor.\n\nVerified target: BLES00825\nSave payload: decrypted APP.BIN\nExpected APP.BIN size: 0x48064 (295,012 bytes)\n\nIncludes officer editing, weapons, storehouse items/materials, city upgrades, collections/unlocks, Story/Requests editing, backups, validation, and the bundled weapon database.\n\nSource ZIP is attached to this release."
